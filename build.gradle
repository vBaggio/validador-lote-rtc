plugins {
    id 'java'
    id 'application'
}

group = 'br.com.validadorlote'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.com.validadorlote.App'
}

test {
    useJUnitPlatform {
        excludeTags 'slow'
    }
    // A JVM de teste é forkada e não herda o locale do daemon. O repasse permite reproduzir a
    // suíte na máquina de outro idioma, que é onde a extração de campo quebrava (D-023):
    //   ./gradlew test -Duser.language=de -Duser.country=DE
    ['user.language', 'user.country'].each { p ->
        if (System.getProperty(p)) systemProperty p, System.getProperty(p)
    }
}

tasks.register('slowTest', Test) {
    description = 'Roda testes lentos (@Tag("slow")).'
    group = 'verification'
    useJUnitPlatform { includeTags 'slow' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// Baixa o pacote oficial da Calculadora e re-extrai os XSDs para resources.
// Uso manual quando a RFB atualizar a base. Rede APENAS aqui — nunca no build.
tasks.register('updateSchemas') {
    description = 'Atualiza src/main/resources/schemas a partir do JAR oficial da Calculadora.'
    group = 'build setup'
    doLast {
        def endpoint = 'https://piloto-cbs.tributos.gov.br/servico/calculadora-consumo/api/calculadora/download/url?platform=default'
        def downloadUrl = new groovy.json.JsonSlurper().parse(new URL(endpoint)).downloadUrl
        def zipFile = layout.buildDirectory.file('calculadora/calculadora.zip').get().asFile
        zipFile.parentFile.mkdirs()
        logger.lifecycle("Baixando ${downloadUrl} (~250 MB)...")
        new URL(downloadUrl).withInputStream { i -> zipFile.withOutputStream { o -> o << i } }
        def unzipDir = layout.buildDirectory.dir('calculadora/unzipped').get().asFile
        copy { from zipTree(zipFile); into unzipDir; include '**/api-regime-geral.jar' }
        def jar = fileTree(unzipDir).matching { include '**/api-regime-geral.jar' }.singleFile
        def schemasDir = file('src/main/resources/schemas')
        delete fileTree(schemasDir) { include 'nfe/**', 'nfce/**' }
        copy {
            from zipTree(jar)
            into schemasDir
            include 'BOOT-INF/classes/xml/nfe/**', 'BOOT-INF/classes/xml/nfce/**'
            eachFile { it.path = it.path.replaceFirst('BOOT-INF/classes/xml/', '') }
            includeEmptyDirs = false
        }
        def props = file('src/main/resources/schemas/schemas-version.properties')
        def old = new Properties()
        if (props.exists()) { props.withInputStream { old.load(it) } }
        props.text = """# Proveniência dos schemas XSD oficiais embarcados.
# Extraídos de api-regime-geral.jar (Calculadora de Tributos da RFB), em BOOT-INF/classes/xml/.
# Para atualizar quando a RFB publicar base nova: ./gradlew updateSchemas
# O endpoint ESTÁVEL de download vive nessa task (build.gradle); sourceUrl abaixo é a URL
# pré-assinada que ele resolveu nesta extração — ela expira e não serve para re-download.
engineVersion=${old.getProperty('engineVersion', 'ATUALIZAR-MANUALMENTE')}
baseVersion=${old.getProperty('baseVersion', 'ATUALIZAR-MANUALMENTE')}
extractedAt=${new Date().format('yyyy-MM-dd')}
sourceUrl=${downloadUrl}
"""
        logger.lifecycle('Schemas atualizados. CONFIRA engineVersion/baseVersion em schemas-version.properties (endpoint dados-abertos/versao).')
    }
}

// Ingestão da tabela oficial CST x cClassTrib publicada pela SVRS. Uso manual quando a base
// mudar. Rede APENAS aqui — build e CI nunca tocam a rede (mesma política de updateSchemas).
tasks.register('updateFiscalTables') {
    description = 'Atualiza src/main/resources/tables a partir do portal da SVRS.'
    group = 'build setup'
    doLast {
        def url = 'https://dfe-portal.svrs.rs.gov.br/DFE/ClassificacaoTributaria'
        logger.lifecycle("Baixando ${url} ...")
        def html = new URL(url).getText('UTF-8')

        def m = (html =~ /dadosOriginais\s*=\s*(\[.*?\]);/)
        if (!m.find()) {
            throw new GradleException(
                'Não encontrei dadosOriginais na página da SVRS. O layout mudou — ' +
                'a extração precisa ser revista antes de atualizar a base.')
        }
        def bruto = new groovy.json.JsonSlurper().parseText(m.group(1))

        // Falha ruidosa: base vazia ou sem os indicadores é pior que base velha.
        if (bruto.size() < 10) {
            throw new GradleException("Esperava ao menos 10 CSTs, vieram ${bruto.size()}.")
        }
        def obrigatorios = ['Cst', 'IndExigeTrib', 'IndReducaoAliq', 'ClassificacoesTributarias']
        obrigatorios.each { campo ->
            if (!bruto[0].containsKey(campo)) {
                throw new GradleException("Campo '${campo}' ausente no primeiro CST. Formato mudou.")
            }
        }
        // Mesma checagem no nível da classificação: sem isso, uma classificação renomeada
        // passa pelas guardas de cima intacta e só quebra silenciosamente na destilação.
        def primeiroComClassificacao = bruto.find { (it.ClassificacoesTributarias ?: []).size() > 0 }
        if (primeiroComClassificacao == null) {
            throw new GradleException('Nenhum CST trouxe classificações tributárias. Formato mudou.')
        }
        def obrigatoriosCt = ['CodClassTrib', 'NomeReduzido', 'IndNfe', 'IndNfce']
        def primeiraClassificacao = primeiroComClassificacao.ClassificacoesTributarias[0]
        obrigatoriosCt.each { campo ->
            if (!primeiraClassificacao.containsKey(campo)) {
                throw new GradleException("Campo '${campo}' ausente na primeira classificação tributária. Formato mudou.")
            }
        }

        def destilado = bruto.collect { cst ->
            [
                cst              : cst.Cst,
                nome             : cst.NomeCst,
                exigeGrupo       : cst.IndExigeTrib,
                exigeReducao     : cst.IndReducaoAliq,
                permiteDiferimento: cst.IndDiferimento,
                iniVig           : cst.DthIniVig,
                fimVig           : cst.DthFimVig,
                classificacoes   : (cst.ClassificacoesTributarias ?: []).collect { ct ->
                    [
                        codigo   : ct.CodClassTrib,
                        nome     : ct.NomeReduzido,
                        nfe      : ct.IndNfe,
                        nfce     : ct.IndNfce,
                        percRedIbs: ct.PercRedIbs,
                        percRedCbs: ct.PercRedCbs,
                        iniVig   : ct.DthIniVig,
                        fimVig   : ct.DthFimVig
                    ]
                }
            ]
        }
        def totalCt = destilado.sum { it.classificacoes.size() }

        // Validação estrutural do resultado da destilação: pega qualquer campo renomeado no
        // portal, não só os quatro nomes verificados acima. Um CST ou código de classificação
        // nulo/vazio nunca colide sozinho — ele colide com todo o resto na mesma chave do mapa
        // em FiscalTables, e a contagem de registros continua "normal".
        destilado.each { cst ->
            if (!cst.cst) {
                throw new GradleException(
                    'CST com código nulo ou vazio após a destilação — campo renomeado no portal?')
            }
        }
        def todosCodigosCt = destilado.collectMany { it.classificacoes.collect { ct -> ct.codigo } }
        def codigosInvalidos = todosCodigosCt.findAll { !it }
        if (!codigosInvalidos.isEmpty()) {
            throw new GradleException(
                "${codigosInvalidos.size()} classificação(ões) com código nulo ou vazio após a " +
                'destilação — campo renomeado no portal?')
        }
        def duplicados = todosCodigosCt.countBy { it }.findAll { codigo, vezes -> vezes > 1 }.keySet()
        if (!duplicados.isEmpty()) {
            throw new GradleException(
                "Códigos de classificação duplicados após a destilação: ${duplicados}. " +
                'Colisão de chave — provável campo renomeado no portal.')
        }

        def dir = file('src/main/resources/tables')
        dir.mkdirs()
        def arquivoAtual = new File(dir, 'cst-cclasstrib.json')

        // Piso de quantidade: comparado com a base já embarcada quando ela existe, porque os
        // números reais (18 CSTs / 164 classificações hoje) vão mudar quando a RFB publicar
        // base nova, e um piso absoluto alto demais quebraria essa atualização por motivo
        // errado. 80% da base anterior é sinal de captura parcial (rede cortada, paginação
        // não seguida etc.), não de atualização legítima — atualizações legítimas adicionam
        // ou removem poucos registros, não derrubam a base a menos de 4/5 do tamanho.
        // Sem base anterior (primeira extração), cai num piso absoluto mais próximo da
        // realidade (18/164) que os antigos 10/100, que deixavam passar captura truncada.
        if (arquivoAtual.exists()) {
            def anteriores = new groovy.json.JsonSlurper().parse(arquivoAtual)
            def cstCountAnterior = anteriores.size()
            def ctCountAnterior = anteriores.sum { it.classificacoes.size() }
            def pisoCst = Math.ceil(cstCountAnterior * 0.8) as int
            def pisoCt = Math.ceil(ctCountAnterior * 0.8) as int
            if (destilado.size() < pisoCst) {
                throw new GradleException(
                    "Base embarcada tem ${cstCountAnterior} CSTs; a nova extração trouxe " +
                    "${destilado.size()} (< 80%). Parece captura parcial — confira manualmente " +
                    'antes de sobrescrever.')
            }
            if (totalCt < pisoCt) {
                throw new GradleException(
                    "Base embarcada tem ${ctCountAnterior} classificações; a nova extração " +
                    "trouxe ${totalCt} (< 80%). Parece captura parcial — confira manualmente " +
                    'antes de sobrescrever.')
            }
        } else {
            if (destilado.size() < 15) {
                throw new GradleException("Esperava ao menos 15 CSTs, vieram ${destilado.size()}.")
            }
            if (totalCt < 140) {
                throw new GradleException("Esperava ao menos 140 classificações, vieram ${totalCt}.")
            }
        }

        arquivoAtual.text = groovy.json.JsonOutput.toJson(destilado)

        def props = new File(dir, 'manifest.properties')
        props.text = """# Proveniência dos artefatos oficiais embarcados.
# Atualize com: ./gradlew updateSchemas updateFiscalTables
tables.source=${url}
tables.extractedAt=${new Date().format('yyyy-MM-dd')}
tables.cstCount=${destilado.size()}
tables.classTribCount=${totalCt}
"""
        logger.lifecycle("Gravados ${destilado.size()} CSTs e ${totalCt} classificações.")
    }
}
