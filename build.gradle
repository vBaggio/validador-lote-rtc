plugins {
    id 'java'
    id 'application'
}

group = 'br.com.validadorlote'
// A release tag supplies the version in CI; keep a usable development default locally.
version = findProperty('appVersion') ?: '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.6'
    implementation 'com.formdev:flatlaf-extras:3.6'
    implementation 'com.formdev:flatlaf-fonts-roboto:2.137'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'br.com.validadorlote.App'
}

test {
    useJUnitPlatform {
        excludeTags 'slow'
    }
    // A JVM de teste é forkada e não herda o locale do daemon. O repasse permite reproduzir a
    // suíte na máquina de outro idioma, que é onde a extração de campo quebrava (D-023):
    //   ./gradlew test -Duser.language=de -Duser.country=DE
    ['user.language', 'user.country', 'sun.java2d.uiScale'].each { p ->
        if (System.getProperty(p)) systemProperty p, System.getProperty(p)
    }
}

tasks.register('slowTest', Test) {
    description = 'Roda testes lentos (@Tag("slow")).'
    group = 'verification'
    useJUnitPlatform { includeTags 'slow' }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

// Legado deliberadamente bloqueado (B6): a Calculadora não é fonte de schemas NF-e/NFC-e.
// A manutenção de release usa o Portal Nacional, staging e revisão humana do diff antes de tocar
// resources. Esta task permanece apenas para falhar com orientação inequívoca em automações antigas.
tasks.register('updateSchemas') {
    description = 'DESATIVADA: não sobrescreve schemas via Calculadora; consulte docs do canal B6.'
    group = 'build setup'
    doFirst {
        throw new GradleException(
                'updateSchemas está desativada: a Calculadora não é autoridade dos schemas NF-e/NFC-e. ' +
                'Use o canal B6 em runtime ou faça manutenção de release pelo Portal Nacional, em staging, ' +
                'revise o diff e só então altere src/main/resources.')
    }
    doLast {
        def endpoint = 'https://piloto-cbs.tributos.gov.br/servico/calculadora-consumo/api/calculadora/download/url?platform=default'
        def downloadUrl = new groovy.json.JsonSlurper().parse(new URL(endpoint)).downloadUrl
        def zipFile = layout.buildDirectory.file('calculadora/calculadora.zip').get().asFile
        zipFile.parentFile.mkdirs()
        logger.lifecycle("Baixando ${downloadUrl} (~250 MB)...")
        new URL(downloadUrl).withInputStream { i -> zipFile.withOutputStream { o -> o << i } }
        def unzipDir = layout.buildDirectory.dir('calculadora/unzipped').get().asFile
        copy { from zipTree(zipFile); into unzipDir; include '**/api-regime-geral.jar' }
        def jar = fileTree(unzipDir).matching { include '**/api-regime-geral.jar' }.singleFile
        def schemasDir = file('src/main/resources/schemas')
        delete fileTree(schemasDir) { include 'nfe/**', 'nfce/**' }
        copy {
            from zipTree(jar)
            into schemasDir
            include 'BOOT-INF/classes/xml/nfe/**', 'BOOT-INF/classes/xml/nfce/**'
            eachFile { it.path = it.path.replaceFirst('BOOT-INF/classes/xml/', '') }
            includeEmptyDirs = false
        }
        def props = file('src/main/resources/schemas/schemas-version.properties')
        def old = new Properties()
        if (props.exists()) { props.withInputStream { old.load(it) } }
        props.text = """# Proveniência dos schemas XSD oficiais embarcados.
# Extraídos de api-regime-geral.jar (Calculadora de Tributos da RFB), em BOOT-INF/classes/xml/.
# Para atualizar quando a RFB publicar base nova: ./gradlew updateSchemas
# O endpoint ESTÁVEL de download vive nessa task (build.gradle); sourceUrl abaixo é a URL
# pré-assinada que ele resolveu nesta extração — ela expira e não serve para re-download.
engineVersion=${old.getProperty('engineVersion', 'ATUALIZAR-MANUALMENTE')}
baseVersion=${old.getProperty('baseVersion', 'ATUALIZAR-MANUALMENTE')}
extractedAt=${new Date().format('yyyy-MM-dd')}
sourceUrl=${downloadUrl}
"""
        logger.lifecycle('Schemas atualizados. CONFIRA engineVersion/baseVersion em schemas-version.properties (endpoint dados-abertos/versao).')
    }
}

// Legado deliberadamente bloqueado (B6): a atualização do usuário é o canal runtime transacional.
// Resources só mudam por manutenção de release, com candidata em staging e revisão explícita do diff.
tasks.register('updateFiscalTables') {
    description = 'DESATIVADA: não sobrescreve tabelas sem staging e revisão de release.'
    group = 'build setup'
    doFirst {
        throw new GradleException(
                'updateFiscalTables está desativada para evitar sobrescrita de resources. A fonte continua a SVRS, ' +
                'mas use o canal B6 em runtime ou uma manutenção de release com candidata em staging, diff revisado ' +
                'e atualização manual do manifesto.')
    }
    doLast {
        def url = 'https://dfe-portal.svrs.rs.gov.br/DFE/TabelaClassificacaoTributaria'
        logger.lifecycle("Baixando ${url} ...")
        def html = new URL(url).getText('UTF-8')

        def m = (html =~ /dadosOriginais\s*=\s*(\[.*?\]);/)
        if (!m.find()) {
            throw new GradleException(
                'Não encontrei dadosOriginais na página da SVRS. O layout mudou — ' +
                'a extração precisa ser revista antes de atualizar a base.')
        }
        def bruto = new groovy.json.JsonSlurper().parseText(m.group(1))

        // Falha ruidosa: base vazia ou sem os indicadores é pior que base velha.
        if (bruto.size() < 10) {
            throw new GradleException("Esperava ao menos 10 CSTs, vieram ${bruto.size()}.")
        }
        def requiredBoolean = { map, field, context ->
            if (!map.containsKey(field) || !(map[field] instanceof Boolean)) {
                throw new GradleException(
                        "Campo booleano '${field}' inválido em ${context}. Formato mudou.")
            }
        }
        def requiredText = { map, field, context ->
            if (!map.containsKey(field) || !(map[field] instanceof String)
                    || map[field].trim().isEmpty()) {
                throw new GradleException(
                        "Campo textual '${field}' inválido em ${context}. Formato mudou.")
            }
        }
        def validDate = { value, field, context, required ->
            if (value == null && !required) return
            if (!(value instanceof String) || value.length() < 10) {
                throw new GradleException("Data '${field}' inválida em ${context}.")
            }
            try {
                java.time.LocalDate.parse(value.substring(0, 10))
            } catch (java.time.DateTimeException e) {
                throw new GradleException("Data '${field}' inválida em ${context}.", e)
            }
        }

        bruto.eachWithIndex { cst, cstIndex ->
            def context = "CST na posição ${cstIndex}"
            if (!(cst instanceof Map)) {
                throw new GradleException("Registro inválido em ${context}. Formato mudou.")
            }
            requiredText(cst, 'Cst', context)
            requiredText(cst, 'NomeCst', context)
            requiredBoolean(cst, 'IndExigeTrib', context)
            requiredBoolean(cst, 'IndReducaoAliq', context)
            requiredBoolean(cst, 'IndDiferimento', context)
            validDate(cst.DthIniVig, 'DthIniVig', context, true)
            validDate(cst.DthFimVig, 'DthFimVig', context, false)
            if (!(cst.ClassificacoesTributarias instanceof List)) {
                throw new GradleException(
                        "Coleção 'ClassificacoesTributarias' inválida em ${context}. Formato mudou.")
            }

            cst.ClassificacoesTributarias.eachWithIndex { ct, ctIndex ->
                def ctContext = "classificação na posição ${ctIndex} de ${context}"
                if (!(ct instanceof Map)) {
                    throw new GradleException("Registro inválido em ${ctContext}. Formato mudou.")
                }
                requiredText(ct, 'CodClassTrib', ctContext)
                requiredText(ct, 'Cst', ctContext)
                requiredText(ct, 'NomeReduzido', ctContext)
                requiredBoolean(ct, 'IndNfe', ctContext)
                requiredBoolean(ct, 'IndNfce', ctContext)
                validDate(ct.DthIniVig, 'DthIniVig', ctContext, true)
                validDate(ct.DthFimVig, 'DthFimVig', ctContext, false)
                ['PercRedIbs', 'PercRedCbs'].each { field ->
                    if (ct[field] != null && !(ct[field] instanceof Number)) {
                        throw new GradleException(
                                "Percentual '${field}' inválido em ${ctContext}. Formato mudou.")
                    }
                }
                if (ct.Cst != cst.Cst) {
                    throw new GradleException("CST da ${ctContext} diverge de ${context}.")
                }
            }
        }

        def cstsDuplicados = bruto.collect { it.Cst }
                .countBy { it }
                .findAll { codigo, vezes -> vezes > 1 }
                .keySet()
        if (!cstsDuplicados.isEmpty()) {
            throw new GradleException("CSTs duplicados: ${cstsDuplicados}.")
        }

        def destilado = bruto.collect { cst ->
            [
                cst              : cst.Cst,
                nome             : cst.NomeCst,
                exigeGrupo       : cst.IndExigeTrib,
                exigeReducao     : cst.IndReducaoAliq,
                exigeDiferimento : cst.IndDiferimento,
                iniVig           : cst.DthIniVig,
                fimVig           : cst.DthFimVig,
                classificacoes   : (cst.ClassificacoesTributarias ?: []).collect { ct ->
                    [
                        codigo   : ct.CodClassTrib,
                        nome     : ct.NomeReduzido,
                        nfe      : ct.IndNfe,
                        nfce     : ct.IndNfce,
                        percRedIbs: ct.PercRedIbs,
                        percRedCbs: ct.PercRedCbs,
                        iniVig   : ct.DthIniVig,
                        fimVig   : ct.DthFimVig
                    ]
                }
            ]
        }
        def totalCt = destilado.sum { it.classificacoes.size() }

        // Validação estrutural do resultado da destilação: pega qualquer campo renomeado no
        // portal, não só os quatro nomes verificados acima. Um CST ou código de classificação
        // nulo/vazio nunca colide sozinho — ele colide com todo o resto na mesma chave do mapa
        // em FiscalTables, e a contagem de registros continua "normal".
        destilado.each { cst ->
            if (!cst.cst) {
                throw new GradleException(
                    'CST com código nulo ou vazio após a destilação — campo renomeado no portal?')
            }
        }
        def todosCodigosCt = destilado.collectMany { it.classificacoes.collect { ct -> ct.codigo } }
        def codigosInvalidos = todosCodigosCt.findAll { !it }
        if (!codigosInvalidos.isEmpty()) {
            throw new GradleException(
                "${codigosInvalidos.size()} classificação(ões) com código nulo ou vazio após a " +
                'destilação — campo renomeado no portal?')
        }
        def duplicados = todosCodigosCt.countBy { it }.findAll { codigo, vezes -> vezes > 1 }.keySet()
        if (!duplicados.isEmpty()) {
            throw new GradleException(
                "Códigos de classificação duplicados após a destilação: ${duplicados}. " +
                'Colisão de chave — provável campo renomeado no portal.')
        }

        def dir = file('src/main/resources/tables')
        dir.mkdirs()
        def arquivoAtual = new File(dir, 'cst-cclasstrib.json')

        // Piso de quantidade: comparado com a base já embarcada quando ela existe, porque os
        // números reais (18 CSTs / 164 classificações hoje) vão mudar quando a RFB publicar
        // base nova, e um piso absoluto alto demais quebraria essa atualização por motivo
        // errado. 80% da base anterior é sinal de captura parcial (rede cortada, paginação
        // não seguida etc.), não de atualização legítima — atualizações legítimas adicionam
        // ou removem poucos registros, não derrubam a base a menos de 4/5 do tamanho.
        // Sem base anterior (primeira extração), cai num piso absoluto mais próximo da
        // realidade (18/164) que os antigos 10/100, que deixavam passar captura truncada.
        if (arquivoAtual.exists()) {
            def anteriores = new groovy.json.JsonSlurper().parse(arquivoAtual)
            def cstCountAnterior = anteriores.size()
            def ctCountAnterior = anteriores.sum { it.classificacoes.size() }
            def pisoCst = Math.ceil(cstCountAnterior * 0.8) as int
            def pisoCt = Math.ceil(ctCountAnterior * 0.8) as int
            if (destilado.size() < pisoCst) {
                throw new GradleException(
                    "Base embarcada tem ${cstCountAnterior} CSTs; a nova extração trouxe " +
                    "${destilado.size()} (< 80%). Parece captura parcial — confira manualmente " +
                    'antes de sobrescrever.')
            }
            if (totalCt < pisoCt) {
                throw new GradleException(
                    "Base embarcada tem ${ctCountAnterior} classificações; a nova extração " +
                    "trouxe ${totalCt} (< 80%). Parece captura parcial — confira manualmente " +
                    'antes de sobrescrever.')
            }
        } else {
            if (destilado.size() < 15) {
                throw new GradleException("Esperava ao menos 15 CSTs, vieram ${destilado.size()}.")
            }
            if (totalCt < 140) {
                throw new GradleException("Esperava ao menos 140 classificações, vieram ${totalCt}.")
            }
        }

        arquivoAtual.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(destilado)) + System.lineSeparator()

        def props = new File(dir, 'manifest.properties')
        def old = new Properties()
        if (props.exists()) {
            props.withInputStream { old.load(it) }
        }
        props.text = """# Proveniência dos artefatos oficiais embarcados.
# Atualize com: ./gradlew updateSchemas updateFiscalTables
tables.source=${url}
tables.extractedAt=${new Date().format('yyyy-MM-dd')}
tables.lastCheckedAt=${new Date().format('yyyy-MM-dd')}
tables.reference=Informe Técnico 2025.002
tables.referenceVersion=${old.getProperty('tables.referenceVersion', 'ATUALIZAR-MANUALMENTE')}
tables.referencePublishedAt=${old.getProperty('tables.referencePublishedAt', 'ATUALIZAR-MANUALMENTE')}
tables.cstCount=${destilado.size()}
tables.classTribCount=${totalCt}
"""
        logger.lifecycle("Gravados ${destilado.size()} CSTs e ${totalCt} classificações.")
        logger.lifecycle(
                'Tabela atualizada. CONFIRA tables.referenceVersion e tables.referencePublishedAt no manifesto.')
    }
}

// ---------- Empacotamento (D-008: jlink enxuto no v0) ----------
def jpackageModules = 'java.base,java.desktop,java.xml,java.logging,java.net.http,java.prefs,jdk.unsupported'
// This UUID identifies the product across MSI releases. It must never change.
def windowsUpgradeUuid = '1af12bf9-b54e-42f6-a237-bf7395d57dc2'
def packagingIcons = layout.projectDirectory.dir('packaging/icons')
def currentOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)

def jpackageIcon = {
    if (currentOs.contains('win')) {
        return packagingIcons.file('app-icon.ico').asFile
    }
    if (currentOs.contains('linux')) {
        return packagingIcons.file('app-icon.png').asFile
    }
    if (currentOs.contains('mac')) {
        return packagingIcons.file('app-icon.icns').asFile
    }
    return null
}

def commandAvailable = { String command ->
    (System.getenv('PATH') ?: '').split(File.pathSeparator)
            .any { directory -> new File(directory, command).canExecute() }
}

def linuxInstallerType = {
    def osRelease = file('/etc/os-release')
    def distribution = osRelease.isFile() ? osRelease.readLines()
            .findAll { it.startsWith('ID=') || it.startsWith('ID_LIKE=') }
            .collect { it.substring(it.indexOf('=') + 1).replace('"', '') }
            .join(' ').toLowerCase(Locale.ROOT) : ''
    def debTools = commandAvailable('dpkg') && commandAvailable('dpkg-deb')
            && commandAvailable('fakeroot')
    def rpmTools = commandAvailable('rpm') && commandAvailable('rpmbuild')

    if (distribution.contains('debian') || distribution.contains('ubuntu')) {
        if (debTools) return 'deb'
        throw new GradleException('Não é possível gerar DEB: instale dpkg, dpkg-deb e fakeroot.')
    }
    if (distribution.contains('fedora') || distribution.contains('rhel')
            || distribution.contains('suse')) {
        if (rpmTools) return 'rpm'
        throw new GradleException('Não é possível gerar RPM: instale rpm e rpmbuild.')
    }
    if (debTools) return 'deb'
    if (rpmTools) return 'rpm'
    throw new GradleException(
            'Nenhum empacotador Linux disponível: instale dpkg/dpkg-deb/fakeroot para DEB ou rpm/rpmbuild para RPM.')
}

def jpackageArgs = { String type ->
    def libDir = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
    def args = [
            "${System.getProperty('java.home')}/bin/jpackage",
            '--type', type,
            '--name', 'ValidadorLoteRTC',
            '--app-version', version.toString(),
            '--input', libDir.absolutePath,
            '--main-jar', "${project.name}-${version}.jar",
            '--main-class', 'br.com.validadorlote.App',
            '--add-modules', jpackageModules,
            // Preserva bin/java para a verificação do runtime do app-image (D-008).
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files',
            '--dest', layout.buildDirectory.dir('jpackage').get().asFile.absolutePath,
            '--vendor', 'vBaggio',
            '--description', 'Validador de lote de NF-e/NFC-e para a Reforma Tributária (RTC) - ferramenta independente'
    ]
    def icon = jpackageIcon()
    if (icon != null) {
        if (!icon.isFile()) {
            throw new GradleException("Ícone nativo ausente para ${System.getProperty('os.name')}: ${icon}")
        }
        args += ['--icon', icon.absolutePath]
    }
    return args
}

tasks.register('jpackageImage', Exec) {
    group = 'distribution'
    description = 'Gera app-image com runtime embarcado (qualquer SO).'
    dependsOn 'installDist'
    doFirst { delete layout.buildDirectory.dir('jpackage') }
    commandLine jpackageArgs('app-image')
}

tasks.register('jpackageInstaller', Exec) {
    group = 'distribution'
    description = 'Gera o instalador nativo do SO corrente (msi/deb/dmg/rpm).'
    dependsOn 'installDist'
    doFirst {
        delete layout.buildDirectory.dir('jpackage')
        def type = currentOs.contains('win') ? 'msi' : currentOs.contains('mac') ? 'dmg'
                : linuxInstallerType()
        def args = jpackageArgs(type)
        if (currentOs.contains('win')) {
            args += ['--win-menu', '--win-shortcut', '--win-dir-chooser', '--win-per-user-install',
                     '--win-upgrade-uuid', windowsUpgradeUuid]
        }
        commandLine args
    }
}
