name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Windows (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Instalar WiX Toolset
        run: choco install wixtoolset -y --no-progress
      - name: Testes
        shell: bash
        run: ./gradlew clean test --console=plain
      - name: Gerar instalador MSI
        shell: bash
        run: ./gradlew jpackageInstaller --console=plain
      - name: Anexar MSI à Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.msi
          generate_release_notes: true

  linux:
    name: Linux (DEB)
    runs-on: ubuntu-latest
    needs: windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Preparar empacotamento DEB
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dpkg fakeroot
          command -v dpkg
          command -v dpkg-deb
          command -v fakeroot
      - name: Gerar instalador DEB
        run: ./gradlew jpackageInstaller --console=plain
      - name: Anexar DEB à Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.deb

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    needs: windows
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - name: Gerar instalador DMG
        run: ./gradlew jpackageInstaller --console=plain
      - name: Anexar DMG à Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/jpackage/*.dmg
